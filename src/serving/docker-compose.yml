services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-qwen
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        ollama pull qwen3:0.6b
        ollama pull nomic-embed-text
        wait

volumes:
  ollama-data: