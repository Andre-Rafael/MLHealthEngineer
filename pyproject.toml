[project]
name = "mental-health-ML"
version = "0.1.0"
description = ""
authors = [
    {name = "AndreRafael732",email = "andre.souza@turn2c.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas (<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "kagglehub[pandas-datasets] (>=1.0.0,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "ipywidgets (>=8.1.8,<9.0.0)",
    "dvc (>=3.67.1,<4.0.0)",
    "mlflow (>=3.11.1,<4.0.0)",
    "pandera[pandas] (>=0.31.1,<0.32.0)",
    "langchain (>=1.2.15,<2.0.0)",
    "presidio-analyzer (>=2.2.362,<3.0.0)",
    "presidio-anonymizer (>=2.2.362,<3.0.0)",
    "protobuf (==3.20)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"

